version: '3.8'

services:
  web-app:
    build: .
    container_name: web_app_container
    restart: always

  nginx-proxy:
    image: nginx:alpine
    container_name: nginx_proxy_container
    ports:
      - "80:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - web-app
    restart: always
